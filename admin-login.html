<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | EU–India Wine Summit 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

  <div class="auth-card">

    <!-- Shield circle icon -->
    <div class="auth-icon-circle" style="background: var(--wine-deep);">
      <i class="bi bi-shield-lock-fill"></i>
    </div>

    <div class="auth-header">
      <p
        style="font-size:0.68rem; text-transform:uppercase; letter-spacing:0.12em; font-weight:700; color:var(--wine); margin-bottom:4px;">
        EU–INDIA WINE SUMMIT 2026</p>
      <h3
        style="font-family:var(--font-serif); font-weight:800; color:var(--wine); font-size:1.6rem; margin-bottom:6px;">
        Admin Login</h3>
      <p style="font-size:0.82rem; color:#8a7f76; line-height:1.5;">Sign in to manage meeting requests and schedules.
      </p>
    </div>

    <div class="auth-error" id="auth-error">Invalid administrator credentials.</div>

    <form id="adminForm" onsubmit="handleAdminLogin(event)">
      <div class="auth-input-wrap">
        <i class="bi bi-envelope auth-input-icon"></i>
        <input type="email" class="auth-control" id="adm-email" placeholder="Enter admin email" required>
      </div>
      <div class="auth-input-wrap">
        <i class="bi bi-lock auth-input-icon"></i>
        <input type="password" class="auth-control" id="adm-password" placeholder="Enter password" required>
      </div>

      <div class="auth-options">
        <label class="d-flex align-items-center gap-2" style="cursor:pointer; font-weight: 500;">
          <input type="checkbox" style="accent-color:var(--wine);"> Remember me
        </label>
        <a href="#" onclick="alert('Forgot password placeholder')" style="font-weight: 500; font-size: 0.8rem;">Forgot
          Password?</a>
      </div>

      <button type="submit" class="auth-btn" style="background:var(--wine-deep);">Login</button>
    </form>

    <div class="auth-switch" style="margin-top: 25px; font-size: 0.8rem;">
      Are you a participant? <a href="user-login.html" style="color:var(--wine); font-weight:700;">Participant Sign In
        &rarr;</a>
    </div>
  </div>

  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adm-email').value.trim().toLowerCase();
      const password = document.getElementById('adm-password').value;
      const errorDiv = document.getElementById('auth-error');

      // Admin credentials: admin@mediaindia.eu / admin123
      if (email === 'admin@mediaindia.eu' && password === 'admin123') {
        sessionStorage.setItem('admin_logged', 'true');
        sessionStorage.setItem('admin_email', email);
        window.location.href = 'dashboard.html';
      } else {
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>

</html>
