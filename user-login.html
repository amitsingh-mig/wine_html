<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login | Indo-European Wine Meet 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    
    <!-- Silhouettes circle icon -->
    <div class="auth-icon-circle">
      <i class="bi bi-people-fill"></i>
    </div>

    <div class="auth-header">
      <p style="font-size:0.68rem; text-transform:uppercase; letter-spacing:0.12em; font-weight:700; color:var(--wine); margin-bottom:4px;">INDO-EUROPEAN WINE MEET 2026</p>
      <h3 style="font-family:var(--font-serif); font-weight:800; color:var(--wine); font-size:1.6rem; margin-bottom:6px;">User Login</h3>
      <p style="font-size:0.82rem; color:#8a7f76; line-height:1.5;">Login to view your meeting requests and track their status.</p>
    </div>

    <div class="auth-error" id="signin-error">Invalid email or password.</div>

    <form id="signinForm" onsubmit="handleSignIn(event)">
      <div class="auth-input-wrap">
        <i class="bi bi-envelope auth-input-icon"></i>
        <input type="email" class="auth-control" id="si-email" placeholder="Enter your email" required>
      </div>
      <div class="auth-input-wrap">
        <i class="bi bi-lock auth-input-icon"></i>
        <input type="password" class="auth-control" id="si-password" placeholder="Enter your password" required>
      </div>

      <div class="auth-options">
        <label class="d-flex align-items-center gap-2" style="cursor:pointer; font-weight: 500;">
          <input type="checkbox" style="accent-color:var(--wine);"> Remember me
        </label>
        <a href="#" onclick="alert('Forgot password placeholder')" style="font-weight: 500; font-size: 0.8rem;">Forgot Password?</a>
      </div>

      <button type="submit" class="auth-btn">Login</button>
    </form>

    <div class="auth-switch" style="margin-top: 25px; font-size: 0.8rem;">
      Don't have an account? <a href="mailto:r.nayar@mediaindia.eu" style="color:var(--wine); font-weight:700;">Contact event team</a>
    </div>
    <div class="auth-switch" style="margin-top:10px; font-size: 0.8rem;">
      Are you an administrator? <a href="admin-login.html" style="color:var(--terracotta); font-weight:700;">Admin Portal &rarr;</a>
    </div>

  </div>

  <script>
    function initUsers() {
      const users = JSON.parse(localStorage.getItem('wm_users') || '[]');
      if (users.length === 0) {
        users.push({
          email: 'j.dupont@chateaumargaux.fr',
          name: 'Jean Dupont',
          company: 'Château Margaux',
          password: 'password123'
        });
        users.push({
          email: 'priya@sulavineyards.com',
          name: 'Priya Sharma',
          company: 'Sula Vineyards',
          password: 'password123'
        });
        localStorage.setItem('wm_users', JSON.stringify(users));
      }
    }

    function handleSignIn(e) {
      e.preventDefault();
      initUsers();
      const email = document.getElementById('si-email').value.trim().toLowerCase();
      const password = document.getElementById('si-password').value;
      const errorDiv = document.getElementById('signin-error');

      const users = JSON.parse(localStorage.getItem('wm_users') || '[]');
      const user = users.find(u => u.email.toLowerCase() === email && u.password === password);

      if (user) {
        sessionStorage.setItem('user_logged_email', user.email);
        sessionStorage.setItem('user_logged_name', user.name);
        window.location.href = 'user-dashboard.html';
      } else {
        errorDiv.style.display = 'block';
      }
    }

    initUsers();
  </script>
</body>
</html>
